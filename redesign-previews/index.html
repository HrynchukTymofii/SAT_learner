<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<title>SAT Learner — Personalized Digital SAT Mastery Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#05070D;--surface:#10131D;--surface2:#171B28;--line:rgba(255,255,255,.08);
  --text:#F3F5FB;--muted:#8D94AB;--dim:#5E657B;
  --blue:#4F74FF;--teal:#3CC6B4;--indigo:#6366F1;--ink:#0A0D16;
  --cta:linear-gradient(90deg,#3CC6B4 0%,#4F74FF 100%);
  --card:radial-gradient(130% 85% at 50% 115%,#2F6BFF 0%,#1B3FAE 32%,#0E1633 66%,#0A0D19 100%);
  --card-sat:radial-gradient(130% 85% at 50% 115%,#3CC6B4 0%,#1B3FAE 38%,#0E1633 68%,#0A0D19 100%);
  --amber:#FFD27A;--emerald:#4FD8A4;--rose:#FF5E7E;
}
*{margin:0;padding:0;box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--text);font-family:'Bai Jamjuree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #8FB0FF;outline-offset:3px}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
#app::after{content:"";position:absolute;left:-20%;right:-20%;bottom:-30%;height:60%;background:radial-gradient(closest-side,rgba(47,107,255,.16),transparent);pointer-events:none;z-index:0}

/* Top Navigation Bar */
.top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 16px 6px;min-height:58px}
#app.no-top .top{display:none}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:opacity .2s}
.icon-btn.hide{opacity:0;pointer-events:none}
.progress{flex:1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--cta);border-radius:6px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
#mini{width:38px;height:38px;display:grid;place-items:center}
.badge-sat{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(60,198,180,.15);color:#5FE0C8;border:1px solid rgba(60,198,180,.3)}

/* Stage & Screens */
#stage{position:relative;flex:1;overflow:hidden;z-index:1}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:6px 20px 24px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.screen>*{flex-shrink:0}
.screen.enter{animation:inF .42s cubic-bezier(.2,.8,.2,1) both}
.screen.exit{animation:outF .3s ease both;pointer-events:none}
.screen.back.enter{animation-name:inB}.screen.back.exit{animation-name:outB}
@keyframes inF{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes outF{to{opacity:0;transform:translateX(-32px)}}
@keyframes inB{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
@keyframes outB{to{opacity:0;transform:translateX(32px)}}

.q-title{font-size:27px;line-height:1.15;font-weight:600;letter-spacing:-.01em;margin:10px 0 8px;text-wrap:balance}
.q-sub{color:var(--muted);font-size:15.5px;line-height:1.45;margin-bottom:20px;max-width:38ch}
.center{text-align:center;margin-left:auto;margin-right:auto}

/* Option Cards */
.opts{display:flex;flex-direction:column;gap:10px}
.opts>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:16.5px;font-weight:500;transition:transform .15s,background .25s,border-color .25s}
.opt:active{transform:scale(.98)}
.opt.picked{background:linear-gradient(180deg,#122554,#183f9e);border-color:#5B80FF}
.opt .emo{font-size:22px;width:30px;text-align:center;flex:none}
.opt .letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;transition:.2s}
.opt.picked .letter{background:#fff;border-color:#fff;color:#0A0D16}
.opt .ot{flex:1;display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:13.5px;font-weight:400}
.opt.picked small{color:#C5D3FF}
.box{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--dim);display:grid;place-items:center;transition:.2s}
.opt.picked .box{background:#fff;border-color:#fff}
.box svg{opacity:0;transition:.2s}.opt.picked .box svg{opacity:1}

/* Math Question Box */
.math-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px}
.math-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.math-domain{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--teal);letter-spacing:.05em}
.math-qnum{font-size:12px;color:var(--muted);font-family:monospace}
.math-prompt{font-size:16.5px;line-height:1.45;color:#F3F5FB;font-weight:500}
.math-eq{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;color:#A9DCFA;padding:0 2px}
.explanation{background:rgba(60,198,180,.12);border:1px solid rgba(60,198,180,.35);border-radius:16px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.45;color:#D3EFE8;animation:rise .3s both}
.explanation b{color:#5FE0C8;display:block;margin-bottom:4px}

/* Fact Screens */
.fact{margin-top:8px;border-radius:30px;background:var(--card);border:1px solid rgba(110,150,255,.25);padding:28px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.fact h2{font-size:25px;font-weight:600;line-height:1.18;margin-top:16px;text-wrap:balance}
.stat{font-size:64px;font-weight:700;line-height:1;margin-top:16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#AFC4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.fact p{color:#C9D2EE;font-size:16px;line-height:1.5;margin-top:12px;max-width:32ch}
.fact .src{color:#7F8BB3;font-size:12px;margin-top:16px}
.points{display:flex;flex-direction:column;gap:10px;margin-top:18px;width:100%;text-align:left}
.point{display:flex;gap:12px;align-items:flex-start;background:rgba(5,8,18,.5);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.4;color:#DCE3F7}
.point b{display:block;color:#fff;font-weight:600}
.point .pi{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:rgba(79,116,255,.25)}

/* Footer CTA */
.foot{margin-top:auto;padding-top:16px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);z-index:3}
.cta{position:relative;width:100%;height:58px;border-radius:29px;border:0;background:var(--cta);color:#fff;font-size:18px;font-weight:600;box-shadow:0 12px 30px -12px rgba(79,116,255,.8);display:grid;place-items:center;transition:transform .15s,opacity .2s,background .3s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.35;box-shadow:none}
.cta .spin,.cta .tick{display:none}
.cta.loading .lbl{visibility:hidden}.cta.loading .spin{display:block;position:absolute}
.cta.done{background:linear-gradient(90deg,#4FD8A4,#3CC6B4)}.cta.done .lbl,.cta.done .spin{display:none}.cta.done .tick{display:block;position:absolute}
.spin{width:24px;height:24px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* Avatar & Badges */
.sat-orb{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6CE0FF 0%,#3F67E8 55%,#1A2875 100%);display:grid;place-items:center;box-shadow:0 0 35px rgba(79,116,255,.45);margin:10px auto;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sat-orb svg{width:54px;height:54px;color:#fff}

/* Animated Ring Loading */
.load{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:8px}
.ring-wrap{position:relative;width:200px;height:200px;margin:12px 0 6px}
.ring-wrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-wrap .track{fill:none;stroke:#161A27;stroke-width:10}
.ring-wrap .bar{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:597;stroke-dashoffset:597;transition:stroke-dashoffset .12s linear}
.ring-blob{position:absolute;inset:0;display:grid;place-items:center}
.pct{font-size:42px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
.steps{list-style:none;width:100%;display:flex;flex-direction:column;gap:10px;margin:16px 0 16px;text-align:left}
.steps li{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:15px;transition:color .3s}
.steps li .sd{width:22px;height:22px;border-radius:50%;border:1.5px solid #2A3042;display:grid;place-items:center;flex:none;transition:.3s}
.steps li.act{color:var(--text)}.steps li.act .sd{border-color:#5B80FF;border-top-color:transparent;animation:rot .9s linear infinite}
.steps li.ok{color:#B9C3DE}.steps li.ok .sd{background:#3CC6B4;border-color:#3CC6B4;animation:none}
.steps li .sd svg{opacity:0}.steps li.ok .sd svg{opacity:1}
.tst{width:100%;min-height:130px;border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:16px;text-align:left;transition:opacity .35s,transform .35s}
.tst.fade{opacity:0;transform:translateY(6px)}
.stars{color:var(--amber);letter-spacing:2px;font-size:14px}
.tst p{font-size:14.5px;line-height:1.45;margin:6px 0 8px;color:#DDE3F3}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0B1020}
.ver{color:#5FD6A2;font-size:12px}

/* Bottom Sheet */
.backdrop{position:fixed;inset:0;background:rgba(2,4,10,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:29}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .4s cubic-bezier(.2,.8,.2,1);background:#0E1220;border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:12px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:30;max-height:92%;overflow-y:auto}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:#2A3042;margin:0 auto 14px}
.pop-q{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:18px}
.pop-q small{color:var(--muted);font-size:13.5px}
.pop-q h3{font-size:21px;font-weight:600;line-height:1.25;max-width:26ch}

/* Result Screen */
.chart-card{border-radius:26px;background:var(--surface);border:1px solid var(--line);padding:18px 14px 12px;margin-bottom:14px}
.chart-card h3{font-size:17px;font-weight:600;padding:0 6px}
.chart-card svg{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:16px;padding:6px 6px 0;color:var(--muted);font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:3px;border-radius:2px;display:block}
.sum{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:13px 18px;font-size:15px;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}.sum span{color:var(--muted)}.sum b{font-weight:600;text-align:right}

/* Paywall */
.pw-bar{position:sticky;top:-6px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px -20px 16px;padding:12px 16px;background:rgba(8,11,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pw-bar p{font-size:13.5px;color:#C9D2EE;line-height:1.3}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--amber);font-size:19px}
.pw-bar button{flex:none;height:38px;padding:0 16px;border-radius:19px;border:0;background:var(--cta);color:#fff;font-weight:600;font-size:14.5px}
.comp-card{border-radius:30px;background:var(--card-sat);border:1px solid rgba(110,150,255,.3);padding:22px 18px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.comp-card .meta{align-self:stretch;display:flex;justify-content:space-between;color:#9FA9C9;font-size:13.5px}
.comp-card .cn{font-size:38px;font-weight:700;line-height:1;margin-top:4px;letter-spacing:-.02em}
h2.sec{font-size:21px;font-weight:600;margin:26px 0 12px;line-height:1.2}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border-radius:20px;padding:16px;background:var(--surface);border:1px solid var(--line)}
.vs>div.goal{background:linear-gradient(180deg,#0d2258,#133b9e);border-color:rgba(120,155,255,.4)}
.vs small{color:var(--muted);font-size:13px}.vs .goal small{color:#C5D3FF}
.vs strong{display:block;font-size:32px;font-weight:700;margin:4px 0 8px;font-family:monospace}
.meter{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);text-align:left;width:100%;transition:.2s}
.plan.on{border-color:#5B80FF;background:linear-gradient(180deg,#0f1838,#142c74)}
.plan.pop{margin-top:6px}
.badge{position:absolute;top:-10px;left:16px;padding:3px 10px;border-radius:8px;background:var(--cta);font-size:12px;font-weight:700;color:#fff}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center}
.plan.on .radio{border-color:#fff}.plan.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.plan .pn{font-size:16.5px;font-weight:600}
.plan .pp{font-size:13.5px;color:var(--muted);margin-top:2px}.plan .pp s{color:var(--dim);margin-right:6px}
.perday{text-align:right;line-height:1}
.perday s{display:block;color:var(--dim);font-size:12.5px;margin-bottom:3px}
.perday b{font-size:22px;font-weight:700}.perday small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.fine{color:var(--dim);font-size:12px;line-height:1.5;text-align:center;margin-top:12px}
.gets{display:flex;flex-direction:column;gap:12px}
.gets li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.gets li .ck{flex:none;width:24px;height:24px;border-radius:8px;background:rgba(60,198,180,.18);display:grid;place-items:center;margin-top:1px}
.rating{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.rating strong{font-size:42px;font-weight:700;line-height:1}
.rating p{color:var(--muted);font-size:13.5px}
.reviews{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px 6px;scroll-snap-type:x mandatory}
.reviews .tst{flex:0 0 84%;scroll-snap-align:start;min-height:0}
.guar{display:flex;gap:14px;align-items:flex-start;border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(60,198,180,.12),rgba(60,198,180,.04));border:1px solid rgba(60,198,180,.35)}
.guar b{display:block;font-size:16.5px;margin-bottom:4px;color:#fff}.guar p{color:#BFD9D3;font-size:14px;line-height:1.45}

/* Field */
.field{width:100%;height:56px;border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:0 18px;font-size:17px;outline:none;transition:border-color .2s;color:#fff}
.field:focus{border-color:#5B80FF}
.flabel{display:block;color:var(--muted);font-size:13.5px;margin:0 0 8px 4px}
.note{color:var(--dim);font-size:13px;line-height:1.45;margin-top:12px;display:flex;gap:8px;align-items:flex-start}

/* Checkout */
.co-h{font-size:22px;font-weight:600;margin-bottom:14px}
.order{border-radius:18px;background:var(--surface);border:1px solid var(--line);padding:4px 16px;margin-bottom:16px}
.order div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.order div:last-child{border:0;font-weight:700;font-size:17px}
.order .save{color:#5FD6A2}
.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lock{display:flex;justify-content:center;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin-top:12px}

/* Success Screen */
.succ{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.succ h1{font-size:28px;font-weight:600;margin-top:8px;animation:rise .5s .4s both}
.succ>p{color:var(--muted);font-size:15.5px;margin-top:6px;animation:rise .5s .55s both}
.sat-box{width:100%;margin-top:20px;background:#0A0E1A;border:1px solid var(--line);border-radius:28px;padding:20px;text-align:left;animation:rise .6s .8s both}
.sat-box-h{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sat-box-h b{font-size:20px;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-top:16px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.screen,.reviews,.sheet{scrollbar-width:none;-ms-overflow-style:none}
.screen::-webkit-scrollbar,.reviews::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn hide" id="backBtn" aria-label="Go back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="progress" role="progressbar" aria-label="Funnel progress"><i id="bar"></i></div>
    <div id="mini">
      <span class="badge-sat">SAT</span>
    </div>
  </header>
  <main id="stage"></main>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<canvas id="confetti"></canvas>

<script>
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>typeof v==='function'?v():v;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0D16" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHECK_W='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHECK_T='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FE0C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- SAT State ---------- */

/* ---------- Flow Control ---------- */
function flow(){
  return [
    'grade',
    'target',
    'test_date',
    'weakness',
    'fact1',
    'baseline',
    'daily_time',
    'diagnostic',
    'fact2',

    'email',
    'result',
    'paywall',
    'success'
  ];
}

function clearTimers(){S.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});S.timers=[]}
function later(fn,ms){const t=setTimeout(fn,ms);S.timers.push(t);return t}
function every(fn,ms){const t=setInterval(fn,ms);S.timers.push(t);return t}

function render(id,dir='fwd'){
  clearTimers();
  S.cur=id;
  const def=build(id);
  const stage=$('#stage');
  const old=stage.querySelector('.screen:not(.exit)');
  const el=document.createElement('section');
  el.className='screen enter'+(dir==='back'?' back':'');
  el.innerHTML=def.html;
  if(old){old.classList.add('exit');if(dir==='back')old.classList.add('back');setTimeout(()=>old.remove(),320)}
  stage.appendChild(el);
  setTimeout(()=>el.classList.remove('enter'),460);
  el.scrollTop=0;
  updateTop(id,def);
  const nx=el.querySelector('[data-next]');
  if(nx) nx.addEventListener('click',()=>{buzz();next()});
  def.after&&def.after(el);
}

function updateTop(id,def){
  $('#app').classList.toggle('no-top',!!def.noTop);
  $('#backBtn').classList.toggle('hide',!S.hist.length||!!def.noBack);
  const f=flow(),end=f.indexOf('loading');
  const total=end>0?end:15,i=f.indexOf(id);
  $('#bar').style.width=(end>0&&i>=end?100:Math.max(4,i/total*100))+'%';
}

function next(){
  const f=flow(),i=f.indexOf(S.cur);
  S.hist.push(S.cur);
  render(f[i+1]);
}

function back(){
  if(!S.hist.length)return;
  let id=S.hist.pop();
  while(id==='loading'&&S.hist.length) id=S.hist.pop();
  render(id,'back');
}
$('#backBtn').addEventListener('click',back);

function head(q){return `<h1 class="q-title">${val(q.title)}</h1>${q.sub?`<p class="q-sub">${val(q.sub)}</p>`:'<div style="height:12px"></div>'}`}

function singleScreen(q,onPick){
  const cur=S.answers[q.key];
  return {
    html:head(q)+`<div class="opts">${q.opts.map((o,i)=>`<button class="opt${cur===o.t?' picked':''}" style="--i:${i}" data-i="${i}">${o.e?`<span class="emo">${o.e}</span>`:''}<span class="ot"><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:''}</span></button>`).join('')}</div>`,
    after(el){
      $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{
        $$('.opt',el).forEach(x=>x.classList.remove('picked'));
        b.classList.add('picked');buzz();
        const o=q.opts[+b.dataset.i];S.answers[q.key]=o.t;
        if(onPick) onPick(o);
        later(next,260);
      }));
    }
  };
}

function factScreen(f){
  return {
    html:`<div class="fact"><div class="sat-orb"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg></div><h2>${val(f.title)}</h2>${f.stat!=null?`<div class="stat" data-to="${f.stat}" data-dec="${f.dec||0}" data-suf="${f.suf||''}">0</div>`:''}${f.text?`<p>${val(f.text)}</p>`:''}${f.extra||''}${f.src?`<p class="src">Source: ${f.src}</p>`:''}</div><div class="foot"><button class="cta" data-next><span class="lbl">Continue</span></button></div>`,
    after(el){const s=$('.stat',el);if(s)countUp(s)}
  };
}

function countUp(el){
  const to=+el.dataset.to,dec=+el.dataset.dec,suf=el.dataset.suf,t0=performance.now(),d=1100;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function loadingScreen(){
  const steps=[
    'Analyzing algebra & reading diagnostic baseline',
    'Calibrating against College Board 2026 curve',
    `Building ${user()}'s targeted Mistake Vault`,
    `Finalizing ${S.targetScore}+ roadmap for ${S.testDate}`
  ];
  return {
    noTop:true,noBack:true,
    html:`<div class="load">
      <h1 class="q-title">Analyzing Your Profile</h1>
      <p class="q-sub center" style="margin-bottom:4px">Calibrating your customized Digital SAT Roadmap</p>
      <div class="ring-wrap">
        <svg viewBox="0 0 210 210">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3CC6B4"/>
              <stop offset="1" stop-color="#4F74FF"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="105" cy="105" r="95"/>
          <circle class="bar" id="rbar" cx="105" cy="105" r="95" stroke="url(#lg)"/>
        </svg>
        <div class="ring-blob">
          <div class="pct"><span id="pct">0</span>%</div>
        </div>
      </div>
      <ul class="steps">${steps.map(s=>`<li><span class="sd">${CHECK_W}</span>${s}</li>`).join('')}</ul>
      <div class="tst" id="tst"></div>
    </div>`,
    after(el){
      const C=2*Math.PI*95,rbar=$('#rbar',el),pct=$('#pct',el),lis=$$('.steps li',el),tst=$('#tst',el);
      rbar.style.strokeDasharray=C;rbar.style.strokeDashoffset=C;
      let ti=0;
      const showT=()=>{
        const t=TESTI[ti++%TESTI.length];
        tst.classList.add('fade');
        later(()=>{tst.innerHTML=testiHTML(t);tst.classList.remove('fade')},300);
      };
      tst.innerHTML=testiHTML(TESTI[0]);ti=1;
      every(showT,3200);

      let p=0,paused=false,asked=false;
      const tick=every(()=>{
        if(paused)return;
        p=Math.min(100,p+1);
        pct.textContent=p;
        rbar.style.strokeDashoffset=C*(1-p/100);
        const stepIdx=Math.min(3,Math.floor(p/25));
        lis.forEach((li,i)=>{
          li.classList.toggle('ok',i<stepIdx||p===100);
          li.classList.toggle('act',i===stepIdx&&p<100);
        });

        // Clarifying modal at 52%
        if(p===52 && !asked){
          asked=true;paused=true;
          openSheet(`
            <div class="grab"></div>
            <div class="pop-q">
              <span class="badge-sat">Daily Habit Tuning</span>
              <h3>Would you like a daily practice reminder?</h3>
              <small>Consistent 15-minute drills are the #1 predictor of a 1500+ score.</small>
            </div>
            <div class="opts">
              <button class="opt" data-c="yes"><span class="emo">🔔</span><span class="ot"><b>Yes, send reminders at 7:00 PM</b><small>Keep me accountable</small></span></button>
              <button class="opt" data-c="no"><span class="emo">🙋</span><span class="ot"><b>I will log in on my own</b></span></button>
            </div>
          `, sh=>{
            $$('.opt',sh).forEach(b=>b.addEventListener('click',()=>{
              b.classList.add('picked');buzz();
              setTimeout(()=>{closeSheet();paused=false},280);
            }));
          }, false);
        }

        if(p===100){
          clearInterval(tick);
          buzz();
          later(next,900);
        }
      },75);
    }
  };
}

  return `<div class="stars" aria-label="5 stars">★★★★★</div>
  <p>“${t.t}”</p>
  <div class="who">
    <span class="av" style="background:#5FE0C8">${t.n[0]}</span>
    <div>
      <span style="font-weight:600;color:#F3F5FB">${t.n}</span>
      <span class="ver" style="margin-left:6px;font-weight:700">${t.score}</span>
    </div>
  </div>`;
}

function openSheet(html,after,dismissable=true){
  const sh=$('#sheet');sh.innerHTML=html;sheetDismiss=dismissable;
  $('#backdrop').classList.add('open');requestAnimationFrame(()=>sh.classList.add('open'));

}
function closeSheet(){$('#sheet').classList.remove('open');$('#backdrop').classList.remove('open')}

function smooth(p){
  let d=`M${p[0][0]},${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    d+=` C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`;
  }
  return d;
}

function chartSVG(start,target){
  const xs=[26,92,160,228,294];
  const y=v=>170-((v-1000)/600)*130;
  const w=[start, start+(target-start)*.22, start+(target-start)*.52, start+(target-start)*.80, target].map((v,i)=>[xs[i],y(v)]);
  const al=[start, start+20, start+10, start+35, start+30].map((v,i)=>[xs[i],y(v)]);
  const line=smooth(w);
  const by=Math.max(4,y(target)-36);

  return `<svg viewBox="0 0 320 196" role="img" aria-label="Projected SAT score growth">
    <defs>
      <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3CC6B4" stop-opacity=".35"/>
        <stop offset="1" stop-color="#3CC6B4" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="ln" x1="0" x2="1">
        <stop offset="0" stop-color="#4F74FF"/>
        <stop offset="1" stop-color="#3CC6B4"/>
      </linearGradient>
    </defs>
    ${[1100,1300,1500].map(v=>`<line x1="20" x2="300" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/>`).join('')}
    <path id="area" d="${line} L294,170 L26,170 Z" fill="url(#ar)" opacity="0" style="transition:opacity .8s .9s"/>
    <path d="${smooth(al)}" fill="none" stroke="#5E657B" stroke-width="2.5" stroke-dasharray="5 6"/>
    <path id="mline" d="${line}" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round"/>
    ${w.map((p,i)=>`<circle class="cdot" cx="${p[0]}" cy="${p[1]}" r="${i===4?7:4.5}" fill="${i===4?'#3CC6B4':'#0A0D19'}" stroke="${i===4?'#fff':'#3CC6B4'}" stroke-width="2.5" opacity="0" style="transition:opacity .3s ${0.25+i*.3}s"/>`).join('')}
    <g class="cdot" opacity="0" style="transition:opacity .4s 1.6s">
      <rect x="220" y="${by}" width="88" height="28" rx="9" fill="#fff"/>
      <text x="264" y="${by+19}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A0D19" font-family="Bai Jamjuree, sans-serif">Goal ${target}</text>
    </g>
    <text x="26" y="${y(start)-12}" font-size="12" fill="#8D94AB" font-family="Bai Jamjuree, sans-serif">${start}</text>
    ${['Today','Week 1','Week 2','Week 3',S.testDate.split(' ')[0]].map((l,i)=>`<text x="${xs[i]}" y="192" text-anchor="${i===0?'start':i===4?'end':'middle'}" font-size="11.5" fill="#8D94AB" font-family="Bai Jamjuree, sans-serif">${l}</text>`).join('')}
  </svg>`;
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#confetti'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#3CC6B4','#4F74FF','#6EDCAB','#FFD27A','#ffffff'];
  const cx=innerWidth/2,cy=Math.min(innerHeight*.25,200);
  const P=Array.from({length:120},()=>{
    const a=Math.random()*Math.PI*2,v=4+Math.random()*7;
    return{x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:3+Math.random()*4,c:cols[Math.random()*cols.length|0],round:Math.random()>.5,rot:Math.random()*6};
  });
  const t0=performance.now();
  (function f(t){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{
      p.vy+=.18;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=.1;
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-(t-t0)/2600);
      ctx.fillStyle=p.c;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill()}
      else ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
    });
    if(t-t0<2700)requestAnimationFrame(f);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}
